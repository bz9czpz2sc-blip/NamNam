<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NamNam! – Essen fangen</title>
<style>
:root{--ink:#17324d;--accent:#ff7043;--gold:#ffd84a}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#58c9f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:linear-gradient(#58c9f5 0 72%,#83d45b 72%);touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px}
.pill{flex:1;text-align:center;color:#fff;background:#17324deb;border:2px solid #ffffff55;border-radius:15px;padding:5px 3px;font-weight:900;font-size:12px}
.pill b{display:block;color:var(--gold);font-size:22px;line-height:1.05}
.pause{position:absolute;z-index:5;right:12px;top:64px;width:44px;height:42px;border:0;border-radius:14px;background:#fff;color:var(--ink);font-size:18px;font-weight:1000}
.screen{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#17324d66;backdrop-filter:blur(4px)}
.card{width:min(92vw,440px);max-height:94%;overflow:auto;background:#fffdf6;border-radius:28px;padding:24px;text-align:center;box-shadow:0 18px 55px #17324d55}
.title{font-size:clamp(40px,11vw,64px);font-weight:1000;line-height:.9;margin-bottom:10px}
.sub{font-weight:800;font-size:18px}.foods{font-size:30px;margin:16px 0;letter-spacing:3px}
input{width:100%;font-size:18px;padding:13px;border:3px solid #d9e4e9;border-radius:15px;margin:7px 0 10px;outline:0}
button.main{width:100%;min-height:48px;border:0;border-radius:16px;background:var(--accent);color:#fff;font-size:19px;font-weight:1000;padding:12px 16px;box-shadow:0 5px 0 #c54d29}
button.main:active{transform:translateY(3px);box-shadow:0 2px 0 #c54d29}
button.dark{background:var(--ink);box-shadow:0 5px 0 #0c2130;margin-top:9px}
.board{background:#edf5f8;border-radius:16px;padding:10px 14px;margin-top:15px;text-align:left}
.row{display:flex;justify-content:space-between;padding:4px 0;font-weight:850}
.help{font-size:13px;color:#617683;margin-top:12px}.hidden{display:none!important}
#toast{position:absolute;z-index:8;pointer-events:none;font-size:clamp(28px,8vw,48px);font-weight:1000;color:#ff572f;text-shadow:3px 3px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff;transform:translateX(-50%);animation:pop .75s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.3) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.2) rotate(5deg)}100%{opacity:0;transform:translate(-50%,-90px) scale(.9)}}
</style>
</head>
<body>
<div id="app">
<canvas id="game"></canvas>

<div class="hud hidden" id="hud">
<div class="pill">⭐ PUNKTE<b id="score">0</b></div>
<div class="pill">LEVEL<b id="level">1</b></div>
<div class="pill">🍴 GEFANGEN<b><span id="caught">0</span>/20</b></div>
</div>
<button class="pause hidden" id="pause" type="button">Ⅱ</button>

<section class="screen" id="menu">
<div class="card">
<div class="title">🍴 NAMNAM!</div>
<div class="sub">Fang das Essen mit dem Gesicht!</div>
<div class="foods">🍟 🍌 🧇 🍦 🍉 🍪 🍎</div>
<form id="startForm">
<input id="name" maxlength="14" autocomplete="off" placeholder="Dein Name" required>
<button class="main" type="submit">🚀 LOS GEHT'S!</button>
</form>
<div class="board"><b>🏆 HIGHSCORE</b><div id="scores"></div></div>
<div class="help">📱 Finger links/rechts ziehen<br>⌨️ ← → oder A / D<br>🔊 Lustige Musik startet beim Spiel</div>
</div>
</section>

<section class="screen hidden" id="levelUp">
<div class="card">
<div class="title">LEVEL UP!</div>
<div style="font-size:82px">💪😎💪</div>
<div style="font-size:28px;font-weight:1000">NAAAAAMNAM!!!</div>
<p>Mehr Muskeln. Mehr Tempo. Mehr Essen. 😈</p>
<button class="main" id="continue" type="button">💪 WEITER!</button>
</div>
</section>

<section class="screen hidden" id="gameOver">
<div class="card">
<div class="title">🏆 FERTIG!</div>
<div style="font-size:26px;font-weight:1000">NAMNAM-CHAMPION!</div>
<div id="final" style="font-size:24px;font-weight:900;margin:16px"></div>
<button class="main" id="again" type="button">🔄 NOCHMAL!</button>
<button class="main dark" id="back" type="button">🏠 MENÜ</button>
</div>
</section>
</div>

XU0cTo6mUErh8geuam+jJJDEiyylpWAct898b9qysok65LypUWdwhb/AGmaGWR2LM45QT8K7elXw1nYT2NtDPZRyukasxfocisrK4XzsnviaPiIRuXB/9k=";
const app=document.getElementById("app"), canvas=document.getElementById("game"), ctx=canvas.getContext("2d");
const face=new Image(); face.src=FACE;

const foods=[
["🍟","Pommes",10],["🍌","Banane",15],["🧇","Waffel",20],
["🍦","Eis",25],["🍉","Melone",30],["🍪","Keks",35],["🍎","Apfel",40]
];

let W=0,H=0,dpr=1;
let score=0,caught=0,level=1,name="NamNam",running=false,paused=false;
let last=0,spawnTimer=0,raf=0,px=0,targetX=0,foodsOnScreen=[];
let faceScale=1,mouthAnim=0,catchBounce=0,audio=null;

const $=id=>document.getElementById(id);
const show=id=>$(id).classList.remove("hidden");
const hide=id=>$(id).classList.add("hidden");

function resize(){
 dpr=Math.min(devicePixelRatio||1,2);
 W=innerWidth; H=innerHeight;
 canvas.width=Math.floor(W*dpr); canvas.height=Math.floor(H*dpr);
 canvas.style.width=W+"px"; canvas.style.height=H+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
 if(!running){px=W/2;targetX=px}
}
addEventListener("resize",resize); resize();

function scores(){
 try{return JSON.parse(localStorage.getItem("namnam_scores")||"[]")}catch{return[]}
}
function renderScores(){
 const a=scores();
 $("scores").innerHTML=a.length
 ? a.slice(0,5).map((v,i)=>`<div class="row"><span>${i+1}. ${escapeHtml(v.name)}</span><b>${v.score}</b></div>`).join("")
 : '<div class="help">Noch keine Rekorde – sei der Erste! 😎</div>';
}
function saveScore(){
 try{
  const a=scores(); a.push({name,score}); a.sort((a,b)=>b.score-a.score);
  localStorage.setItem("namnam_scores",JSON.stringify(a.slice(0,10)));
 }catch{}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}

function music(){
 if(audio)return;
 try{
  audio=new (window.AudioContext||window.webkitAudioContext)();
  const master=audio.createGain(); master.gain.value=.045; master.connect(audio.destination);
  const notes=[261.63,329.63,392,329.63,440,392,329.63,261.63,293.66,349.23,440,349.23];
  let i=0;
  function beat(){
   if(!audio)return;
   const o=audio.createOscillator(),g=audio.createGain();
   o.type="triangle";o.frequency.value=notes[i++%notes.length];
   g.gain.setValueAtTime(.0001,audio.currentTime);
   g.gain.exponentialRampToValueAtTime(.7,audio.currentTime+.02);
   g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.17);
   o.connect(g);g.connect(master);o.start();o.stop(audio.currentTime+.19);
   setTimeout(beat,210);
  }
  beat();
 }catch{}
}
function tone(freq,d=.12){
 if(!audio)return;
 const o=audio.createOscillator(),g=audio.createGain();
 o.type="square";o.frequency.value=freq;g.gain.value=.035;
 o.connect(g);g.connect(audio.destination);o.start();
 g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);
 o.stop(audio.currentTime+d);
}

function reset(){
 score=0;caught=0;level=1;foodsOnScreen=[];faceScale=1;
 mouthAnim=0;catchBounce=0;spawnTimer=0;px=W/2;targetX=px;
 $("score").textContent=0;$("caught").textContent=0;$("level").textContent=1;
}

function spawnFood(){
 const f=foods[Math.floor(Math.random()*foods.length)];
 foodsOnScreen.push({
  e:f[0],n:f[1],p:f[2],
  x:35+Math.random()*(W-70),
  y:-55,
  size:34+Math.random()*9,
  vy:145+level*34+Math.random()*55,
  rot:(Math.random()-.5)*.7
 });
}

function popup(text){
 const d=document.createElement("div");
 d.id="toast";d.textContent=text;
 d.style.left=(px/W*100)+"%";d.style.top="67%";
 app.appendChild(d);setTimeout(()=>d.remove(),760);
}

function draw(){
 ctx.clearRect(0,0,W,H);

 const bg=ctx.createLinearGradient(0,0,0,H);
 bg.addColorStop(0,"#55c9f5");bg.addColorStop(.71,"#bcefff");
 bg.addColorStop(.715,"#83d15a");bg.addColorStop(1,"#5eaf3f");
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

 // clouds
 ctx.fillStyle="#ffffffb8";
 for(let i=0;i<6;i++){
  const cx=(i*137+65)%W,cy=82+(i%3)*65;
  ctx.beginPath();ctx.arc(cx,cy,25,0,7);ctx.arc(cx+25,cy+5,18,0,7);ctx.arc(cx-25,cy+7,17,0,7);ctx.fill();
 }

 // falling food
 ctx.textAlign="center";ctx.textBaseline="middle";
 for(const f of foodsOnScreen){
  ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(f.y*.02)*f.rot);
  ctx.font=f.size+"px serif";ctx.fillText(f.e,0,0);ctx.restore();
 }

 // player position
 const py=H-125;
 const r=Math.min(84*faceScale,108);

 // body/feet
 ctx.fillStyle="#17324d";
 ctx.beginPath();ctx.ellipse(px,py+r+48,r*.70,38,0,0,7);ctx.fill();

 if(level>1){
  ctx.font=Math.min(75*faceScale,105)+"px serif";
  ctx.fillText("💪",px,py+r+18);
 }

 // REAL FACE — no huge circle overlay and no crop distortion
 ctx.save();
 ctx.beginPath();
 ctx.ellipse(px,py,r*.82,r,0,0,7);
 ctx.clip();
 if(face.complete)ctx.drawImage(face,px-r*.82,py-r,r*1.64,r*2);
 ctx.restore();

 // subtle border
 ctx.lineWidth=4;ctx.strokeStyle="#ffffff";
 ctx.beginPath();ctx.ellipse(px,py,r*.82,r,0,0,7);ctx.stroke();

 // mouth animation is SMALL and sits over the actual mouth
 // coordinates are relative to the face, so the face itself stays visible.
 const mouthX=px+r*.06, mouthY=py+r*.47;
 if(mouthAnim>0){
  const open=0.55+0.45*Math.sin(mouthAnim*Math.PI);
  ctx.fillStyle="#5b1f2c";
  ctx.beginPath();
  ctx.ellipse(mouthX,mouthY,Math.max(11,r*.12),Math.max(4,r*.045+open*r*.055),0,0,7);
  ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();
  ctx.ellipse(mouthX,mouthY-2,Math.max(6,r*.065),Math.max(2,r*.018),0,0,7);
  ctx.fill();
 }
}

function loop(t){
 if(!running)return;
 const dt=Math.min((t-last)/1000,.035);last=t;

 if(!paused){
  px+=(targetX-px)*Math.min(1,dt*14);
  px=Math.max(50,Math.min(W-50,px));

  mouthAnim=Math.max(0,mouthAnim-dt*2.4);
  catchBounce=Math.max(0,catchBounce-dt*5);

  spawnTimer+=dt;
  const interval=Math.max(.22,.76-(level-1)*.065);
  if(spawnTimer>interval){spawnTimer=0;spawnFood()}

  const py=H-125;
  const r=Math.min(84*faceScale,108);

  for(let i=foodsOnScreen.length-1;i>=0;i--){
   const f=foodsOnScreen[i];
   f.y+=f.vy*dt;

   // generous but fair catch area around the face
   if(Math.hypot(f.x-px,f.y-py)<r*.85+f.size*.35){
    score+=f.p;caught++;foodsOnScreen.splice(i,1);
    mouthAnim=1;catchBounce=1;
    $("score").textContent=score;$("caught").textContent=caught;
    popup("NAMNAM! +"+f.p);tone(500+f.p*5,.13);

    if(caught>=20){
     paused=true;tone(720,.22);
     setTimeout(()=>show("levelUp"),250);
    }
   }else if(f.y>H+70){
    foodsOnScreen.splice(i,1);
   }
  }
 }

 draw();
 raf=requestAnimationFrame(loop);
}

function start(){
 reset();
 name=($("name").value||"NamNam").trim().slice(0,14);
 running=true;paused=false;
 hide("menu");hide("gameOver");hide("levelUp");
 show("hud");$("pause").classList.remove("hidden");
 music();if(audio?.state==="suspended")audio.resume();
 last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}

function nextLevel(){
 level++;caught=0;faceScale=Math.min(1+(level-1)*.16,1.9);
 $("level").textContent=level;$("caught").textContent=0;
 hide("levelUp");paused=false;last=performance.now();
}

function finish(){
 running=false;paused=true;
 $("pause").classList.add("hidden");hide("hud");
 saveScore();renderScores();
 $("final").textContent=name+" – "+score+" Punkte";
 show("gameOver");
}

$("startForm").addEventListener("submit",e=>{e.preventDefault();start()});
$("continue").addEventListener("click",nextLevel);
$("again").addEventListener("click",start);
$("back").addEventListener("click",()=>{hide("gameOver");show("menu");renderScores()});

$("pause").addEventListener("click",()=>{
 paused=!paused;$("pause").textContent=paused?"▶":"Ⅱ";
 if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}
});

// Touch: drag directly where you want the face to go.
canvas.addEventListener("pointerdown",e=>{
 canvas.setPointerCapture?.(e.pointerId);targetX=e.clientX;
});
canvas.addEventListener("pointermove",e=>{
 if(e.buttons)targetX=e.clientX;
});

addEventListener("keydown",e=>{
 if(["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;
 const k=e.key.toLowerCase();
 if(k==="arrowleft"||k==="a"){e.preventDefault();targetX-=75}
 if(k==="arrowright"||k==="d"){e.preventDefault();targetX+=75}
 if(k===" "&&running){
  paused=!paused;$("pause").textContent=paused?"▶":"Ⅱ";
  if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}
 }
});

renderScores();draw();
})();
</script>
