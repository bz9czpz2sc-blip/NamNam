const cv=document.getElementById("c"),ctx=cv.getContext("2d");
let W=innerWidth,H=innerHeight,D=1;
let running=false,paused=false,level=1,score=0,caught=0;
let playerX=innerWidth/2,targetX=innerWidth/2,last=0,spawnClock=0,levelLocked=false;
let foods=[],popups=[],raf=0;

const FOOD=[
 ["🍟",10],["🍌",15],["🧇",20],["🍦",25],["🍉",30],["🍪",35],["🍎",40]
];

function resize(){
 D=Math.min(devicePixelRatio||1,2);
 W=innerWidth;H=innerHeight;
 cv.width=W*D;cv.height=H*D;
 ctx.setTransform(D,0,0,D,0,0);
 playerX=Math.max(60,Math.min(W-60,playerX));
 targetX=Math.max(60,Math.min(W-60,targetX));
}
addEventListener("resize",resize);

function roundedRect(x,y,w,h,r){
 ctx.beginPath();
 ctx.roundRect(x,y,w,h,r);
}

function background(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#20a8ed");
 g.addColorStop(.69,"#8eddf6");
 g.addColorStop(.70,"#77d452");
 g.addColorStop(1,"#56ad3c");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

 // soft clouds
 ctx.fillStyle="rgba(255,255,255,.78)";
 [[.08,.17,80],[.53,.27,100],[.92,.36,78],[.03,.49,65]].forEach(([nx,ny,s])=>{
   const x=nx*W,y=ny*H;
   ctx.beginPath();ctx.ellipse(x,y,s,24,0,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.arc(x-s*.28,y-8,27,0,Math.PI*2);ctx.fill();
   ctx.beginPath();ctx.arc(x+s*.18,y-12,34,0,Math.PI*2);ctx.fill();
 });
}

function hud(){
 const boxes=[
  ["⭐ PUNKTE",String(score)],
  ["LEVEL",String(level)],
  ["🍴 GEFANGEN",caught+"/20"]
 ];
 const gap=7, margin=10, bw=(W-margin*2-gap*2)/3, y=10;
 boxes.forEach((b,i)=>{
   const x=margin+i*(bw+gap);
   ctx.fillStyle="#12344f";roundedRect(x,y,bw,82,17);ctx.fill();
   ctx.strokeStyle="#7192a7";ctx.lineWidth=4;ctx.stroke();
   ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="900 15px system-ui";ctx.fillText(b[0],x+bw/2,y+24);
   ctx.fillStyle="#ffd72f";ctx.font="1000 31px system-ui";ctx.fillText(b[1],x+bw/2,y+59);
 });
 // pause
 ctx.fillStyle="#fff";roundedRect(W-64,102,52,48,15);ctx.fill();
 ctx.fillStyle="#17364e";ctx.font="1000 22px system-ui";ctx.fillText(paused?"▶":"Ⅱ",W-38,127);
}

function spawn(){
 const f=FOOD[Math.floor(Math.random()*FOOD.length)];
 foods.push({
   e:f[0],points:f[1],
   x:35+Math.random()*(W-70),
   y:-55,
   speed:165+level*38+Math.random()*55,
   rot:(Math.random()-.5)*.18
 });
}

function drawBody(cx,baseY){
 // Level 2+ body only. Head is drawn separately on top.
 const s=Math.min(1+(level-2)*.035,1.18);
 ctx.save();ctx.translate(cx,baseY);ctx.scale(s,s);

 // shadow
 ctx.fillStyle="rgba(0,0,0,.18)";
 ctx.beginPath();ctx.ellipse(0,5,112,18,0,0,Math.PI*2);ctx.fill();

 // arms / biceps
 const armGrad=ctx.createLinearGradient(-100,0,100,0);
 armGrad.addColorStop(0,"#a95731");armGrad.addColorStop(.5,"#e39a59");armGrad.addColorStop(1,"#b96338");
 ctx.fillStyle=armGrad;

 ctx.save();ctx.rotate(.13);ctx.beginPath();ctx.ellipse(-82,-72,31,73,0,0,Math.PI*2);ctx.fill();ctx.restore();
 ctx.save();ctx.rotate(-.13);ctx.beginPath();ctx.ellipse(82,-72,31,73,0,0,Math.PI*2);ctx.fill();ctx.restore();

 // fists
 ctx.fillStyle="#c7743f";
 ctx.beginPath();ctx.arc(-88,-5,24,0,Math.PI*2);ctx.arc(88,-5,24,0,Math.PI*2);ctx.fill();

 // red shirt
 const shirt=ctx.createLinearGradient(-70,-145,70,20);
 shirt.addColorStop(0,"#f13b58");shirt.addColorStop(1,"#a91636");
 ctx.fillStyle=shirt;ctx.beginPath();ctx.roundRect(-72,-145,144,165,38);ctx.fill();

 // chest definition
 ctx.strokeStyle="rgba(125,15,42,.45)";ctx.lineWidth=5;
 ctx.beginPath();ctx.moveTo(0,-118);ctx.lineTo(0,-65);ctx.stroke();
 ctx.beginPath();ctx.ellipse(-31,-100,30,22,0,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.ellipse(31,-100,30,22,0,0,Math.PI*2);ctx.stroke();

 ctx.fillStyle="#fff";ctx.textAlign="center";ctx.font="1000 23px system-ui";
 ctx.fillText("NAM",0,-73);ctx.fillText("NAM!",0,-45);
 ctx.restore();
}

function drawHead(cx,headY){
 const scale=level===1?1:.78;
 const w=176*scale,h=205*scale;
 ctx.save();
 ctx.translate(cx,headY);
 // tiny bob/chomp
 let bob=0;
 if(chompUntil>performance.now()) bob=Math.sin((chompUntil-performance.now())*.035)*2;
 ctx.translate(0,bob);
 ctx.drawImage(FACE,0,0,FACE.width,FACE.height,-w/2,-h/2,w,h);

 // animated mouth opening overlay
 if(chompUntil>performance.now()){
   const phase=1-(chompUntil-performance.now())/430;
   const open=Math.sin(Math.min(1,phase)*Math.PI);
   ctx.fillStyle="#451521";
   ctx.beginPath();ctx.ellipse(0,h*.135,w*.12,h*.045*open+.5,0,0,Math.PI*2);ctx.fill();
   ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(0,h*.12,w*.065,h*.018,0,0,Math.PI*2);ctx.fill();
 }
 ctx.restore();
}

let chompUntil=0;
function catchFood(f){
 const px=playerX, py=H-145;
 score+=f.points;caught++;
 f.caught=true;
 chompUntil=performance.now()+430;

 // Popup
 popups.push({x:px,y:py-80,t:performance.now(),points:f.points});

 // little "eat" animation: keep a ghost food flying toward mouth
 f.fly=true;f.fx=f.x;f.fy=f.y;f.ft=performance.now();

 if(caught>=20 && !levelLocked){
   levelLocked=true;paused=true;
   setTimeout(()=>document.getElementById("levelup").classList.remove("hidden"),380);
 }
}

function drawPopups(now){
 popups=popups.filter(p=>now-p.t<760);
 popups.forEach(p=>{
   const k=(now-p.t)/760;
   ctx.globalAlpha=1-k;
   ctx.fillStyle="#ff5b30";ctx.strokeStyle="#fff";ctx.lineWidth=5;
   ctx.font="1000 48px system-ui";ctx.textAlign="center";
   ctx.strokeText("NAMNAM!",p.x,p.y-k*95);ctx.fillText("NAMNAM!",p.x,p.y-k*95);
   ctx.fillStyle="#fff";ctx.strokeStyle="#17364e";ctx.lineWidth=3;
   ctx.font="1000 34px system-ui";
   ctx.strokeText("+"+p.points,p.x,p.y+45-k*95);ctx.fillText("+"+p.points,p.x,p.y+45-k*95);
   ctx.globalAlpha=1;
 });
}

function draw(now){
 ctx.clearRect(0,0,W,H);
 background();

 // falling food
 ctx.textAlign="center";ctx.textBaseline="middle";
 foods.forEach(f=>{
   if(f.fly){
     const k=Math.min(1,(now-f.ft)/260);
     const pr=H-145;
     const ex=playerX,ey=pr;
     const xx=f.fx+(ex-f.fx)*k, yy=f.fy+(ey-f.fy)*k;
     ctx.save();ctx.translate(xx,yy);ctx.scale(1-k*.85,1-k*.85);ctx.rotate(k*1.4);
     ctx.font="52px serif";ctx.fillText(f.e,0,0);ctx.restore();
   }else{
     ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(f.y*.025)*f.rot);
     ctx.font="52px serif";ctx.fillText(f.e,0,0);ctx.restore();
   }
 });

 const headY=H-135;
 if(level>=2) drawBody(playerX,H-42);
 drawHead(playerX,headY);
 hud();
 drawPopups(now);

 requestAnimationFrame(tick);
}

function tick(now){
 if(!running)return;
 const dt=Math.min(.033,(now-last)/1000);last=now;
 if(!paused){
   playerX+=(targetX-playerX)*Math.min(1,dt*18);
   spawnClock+=dt;
   const interval=Math.max(.38,.88-(level-1)*.065);
   if(spawnClock>=interval){spawnClock=0;spawn()}

   const catchY=H-135, catchRadius=level===1?82:74;
   for(let i=foods.length-1;i>=0;i--){
     const f=foods[i];
     if(f.fly){
       if(now-f.ft>270){foods.splice(i,1)}
       continue;
     }
     f.y+=f.speed*dt;
     if(Math.hypot(f.x-playerX,f.y-catchY)<catchRadius){
       catchFood(f);
     }else if(f.y>H+70){
       foods.splice(i,1);
     }
   }
 }
 draw(now);
}

document.getElementById("start").onclick=()=>{
 running=true;paused=false;level=1;score=0;caught=0;foods=[];popups=[];levelLocked=false;
 document.getElementById("menu").classList.add("hidden");
 last=performance.now();requestAnimationFrame(tick);
};

document.getElementById("continue").onclick=()=>{
 level++;caught=0;levelLocked=false;paused=false;foods=[];spawnClock=0;
 document.getElementById("levelup").classList.add("hidden");
 last=performance.now();
};

cv.addEventListener("pointerdown",e=>{targetX=e.clientX});
cv.addEventListener("pointermove",e=>{if(e.buttons)targetX=e.clientX});
addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")targetX-=90;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")targetX+=90;
 targetX=Math.max(55,Math.min(W-55,targetX));
 if(e.key===" "&&running)paused=!paused;
});
resize();requestAnimationFrame(t=>draw(t));
})();
</script>
</body>
</html>
