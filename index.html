<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NamNam! – Essen fangen</title>
<style>
:root{--ink:#17324d;--accent:#ff7043;--gold:#ffd84a}
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#5bc8f4;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}
#app{height:100%;position:relative;overflow:hidden;background:linear-gradient(#55c9f5 0 72%,#7dcd55 72%);touch-action:none}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;z-index:4;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;gap:7px}
.pill{flex:1;text-align:center;color:white;background:#17324dea;border:2px solid #ffffff55;border-radius:15px;padding:5px 4px;font-weight:900;font-size:12px}
.pill b{display:block;color:var(--gold);font-size:22px;line-height:1.05}
.pause{position:absolute;z-index:5;right:12px;top:64px;width:44px;height:42px;border:0;border-radius:14px;background:white;color:var(--ink);font-size:18px;font-weight:1000}
.screen{position:absolute;z-index:10;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#17324d66;backdrop-filter:blur(4px)}
.card{width:min(92vw,440px);max-height:94%;overflow:auto;background:#fffdf6;border-radius:28px;padding:24px;text-align:center;box-shadow:0 18px 55px #17324d55}
.title{font-size:clamp(40px,11vw,64px);font-weight:1000;line-height:.9;margin-bottom:10px}
.sub{font-weight:800;font-size:18px}
.foods{font-size:30px;margin:16px 0;letter-spacing:3px}
input{width:100%;font-size:18px;padding:13px;border:3px solid #d9e4e9;border-radius:15px;margin:7px 0 10px;outline:0}
input:focus{border-color:var(--accent)}
button.main{width:100%;min-height:48px;border:0;border-radius:16px;background:var(--accent);color:white;font-size:19px;font-weight:1000;padding:12px 16px;box-shadow:0 5px 0 #c54d29}
button.main:active{transform:translateY(3px);box-shadow:0 2px 0 #c54d29}
button.dark{background:var(--ink);box-shadow:0 5px 0 #0c2130;margin-top:9px}
.board{background:#edf5f8;border-radius:16px;padding:10px 14px;margin-top:15px;text-align:left}
.row{display:flex;justify-content:space-between;padding:4px 0;font-weight:850}
.help{font-size:13px;color:#617683;margin-top:12px}
.hidden{display:none!important}
#toast{position:absolute;z-index:8;pointer-events:none;font-size:clamp(28px,8vw,48px);font-weight:1000;color:#ff572f;text-shadow:3px 3px white,-2px -2px white,2px -2px white,-2px 2px white;transform:translateX(-50%);animation:pop .75s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.3) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-8px) scale(1.2) rotate(5deg)}100%{opacity:0;transform:translate(-50%,-90px) scale(.9)}}
</style>
</head>
<body>
<div id="app">
<canvas id="game" aria-label="NamNam Spiel"></canvas>
<div class="hud hidden" id="hud">
<div class="pill">⭐ PUNKTE<b id="score">0</b></div>
<div class="pill">LEVEL<b id="level">1</b></div>
<div class="pill">🍴 GEFANGEN<b><span id="caught">0</span>/20</b></div>
</div>
<button class="pause hidden" id="pause" type="button" aria-label="Pause">Ⅱ</button>

<section class="screen" id="menu"><div class="card">
<div class="title">🍴 NAMNAM!</div><div class="sub">Fang das Essen mit deinem Gesicht!</div>
<div class="foods">🍟 🍌 🧇 🍦 🍉 🍪 🍎</div>
<form id="startForm"><input id="name" maxlength="14" autocomplete="off" placeholder="Dein Name" aria-label="Dein Name" required><button class="main" type="submit">🚀 LOS GEHT'S!</button></form>
<div class="board"><b>🏆 HIGHSCORE</b><div id="scores"></div></div>
<div class="help">📱 Finger links/rechts ziehen<br>⌨️ ← → oder A / D<br>🔊 Lustige Musik startet beim Spiel</div>
</div></section>

<section class="screen hidden" id="levelUp"><div class="card">
<div class="title">LEVEL UP!</div><div style="font-size:82px">💪😎💪</div>
<div style="font-size:28px;font-weight:1000">NAAAAAMNAM!!!</div><p>Mehr Muskeln. Mehr Tempo. Mehr Essen. 😈</p>
<button class="main" id="continue" type="button">💪 WEITER!</button>
</div></section>

<section class="screen hidden" id="gameOver"><div class="card">
<div class="title">🏆 FERTIG!</div><div style="font-size:26px;font-weight:1000">NAMNAM-CHAMPION!</div>
<div id="final" style="font-size:24px;font-weight:900;margin:16px"></div>
<button class="main" id="again" type="button">🔄 NOCHMAL!</button>
<button class="main dark" id="back" type="button">🏠 MENÜ</button>
</div></section>
</div>

 {e:"🍦",n:"Eis",p:25},{e:"🍉",n:"Melone",p:30},{e:"🍪",n:"Keks",p:35},{e:"🍎",n:"Apfel",p:40}
];
const $=id=>document.getElementById(id);
let W=0,H=0,dpr=1,score=0,caught=0,level=1,name="NamNam",running=false,paused=false,last=0,spawn=0,raf=0;
let px=300,target=300,food=[],mouth=0,muscle=1,audio=null,melodyTimer=null;

function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!running){px=W/2;target=px}}
addEventListener("resize",resize);resize();

function readScores(){try{return JSON.parse(localStorage.getItem("namnam_scores")||"[]")}catch{return[]}}
function saveScore(){try{let a=readScores();a.push({name,score});a.sort((a,b)=>b.score-a.score);localStorage.setItem("namnam_scores",JSON.stringify(a.slice(0,10)))}catch{}}
function drawScores(){let a=readScores();$("scores").innerHTML=a.length?a.slice(0,5).map((v,i)=>`<div class="row"><span>${i+1}. ${esc(v.name)}</span><b>${v.score}</b></div>`).join(""):'<div class="help">Noch keine Rekorde – sei der Erste! 😎</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function show(id){$(id).classList.remove("hidden")} function hide(id){$(id).classList.add("hidden")}
function music(){if(audio)return;try{audio=new (window.AudioContext||window.webkitAudioContext)();const master=audio.createGain();master.gain.value=.045;master.connect(audio.destination);const notes=[261.63,329.63,392,329.63,440,392,329.63,261.63,293.66,349.23,440,349.23];let i=0;const beat=()=>{if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type="triangle";o.frequency.value=notes[i++%notes.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.7,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.17);o.connect(g);g.connect(master);o.start();o.stop(audio.currentTime+.19);melodyTimer=setTimeout(beat,210)};beat()}catch{}}
function tone(f,d=.12){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d)}
function reset(){score=0;caught=0;level=1;food=[];mouth=0;muscle=1;px=W/2;target=px;spawn=0;$("score").textContent=0;$("caught").textContent=0;$("level").textContent=1}
function spawnFood(){const f=foods[Math.floor(Math.random()*foods.length)];food.push({e:f.e,n:f.n,p:f.p,x:25+Math.random()*(W-50),y:-45,s:34+Math.random()*10,vy:145+level*32+Math.random()*60,r:(Math.random()-.5)*.7})}
function nam(text){const d=document.createElement("div");d.id="toast";d.textContent=text;d.style.left=(px/W*100)+"%";d.style.top="70%";app.appendChild(d);setTimeout(()=>d.remove(),760)}
function draw(){
ctx.clearRect(0,0,W,H);
let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#55c9f5");g.addColorStop(.71,"#bcefff");g.addColorStop(.715,"#82d15a");g.addColorStop(1,"#5dae3e");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
// clouds
ctx.fillStyle="#ffffffaa";for(let i=0;i<6;i++){let cx=(i*137+60)%W,cy=85+(i%3)*62;ctx.beginPath();ctx.arc(cx,cy,24,0,7);ctx.arc(cx+24,cy+5,18,0,7);ctx.arc(cx-24,cy+7,17,0,7);ctx.fill()}
// food
ctx.textAlign="center";ctx.textBaseline="middle";for(const f of food){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(f.y*.02)*f.r);ctx.font=f.s+"px serif";ctx.fillText(f.e,0,0);ctx.restore()}
// body grows with levels
const r=Math.min(58*muscle,92),py=H-120;
ctx.fillStyle="#17324d";ctx.beginPath();ctx.ellipse(px,py+78,r*.62,34,0,0,7);ctx.fill();
if(level>1){ctx.font=(64*muscle)+"px serif";ctx.fillText("💪",px,py+58)}
// face
ctx.save();ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.clip();if(face.complete)ctx.drawImage(face,px-r,py-r,r*2,r*2);else{ctx.fillStyle="#ffd4b0";ctx.fill()}ctx.restore();
ctx.lineWidth=4;ctx.strokeStyle="#fff";ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.stroke();
// mouth: opens on capture, then closes
if(mouth>0){let open=.18+.22*(mouth);ctx.fillStyle="#341820";ctx.beginPath();ctx.ellipse(px,py+r*.35,r*.24,r*open,0,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(px,py+r*.31,r*.12,r*.05,0,0,7);ctx.fill()}
}
function loop(t){
if(!running)return;const dt=Math.min((t-last)/1000,.035);last=t;
if(!paused){px+=(target-px)*Math.min(1,dt*13);px=Math.max(48,Math.min(W-48,px));mouth=Math.max(0,mouth-dt*2.7);spawn+=dt;const interval=Math.max(.23,.78-(level-1)*.065);if(spawn>interval){spawn=0;spawnFood()}
const py=H-120,r=Math.min(58*muscle,92);
for(let i=food.length-1;i>=0;i--){const f=food[i];f.y+=f.vy*dt;const d=Math.hypot(f.x-px,f.y-py);if(d<r+f.s*.28){score+=f.p;caught++;mouth=1;$("score").textContent=score;$("caught").textContent=caught;nam("NAMNAM! +"+f.p);tone(500+f.p*5,.13);food.splice(i,1);if(caught>=20){paused=true;tone(720,.2);setTimeout(()=>show("levelUp"),220)}}else if(f.y>H+60)food.splice(i,1)}}
draw();raf=requestAnimationFrame(loop)
}
function start(){reset();name=($("name").value||"NamNam").trim().slice(0,14);running=true;paused=false;hide("menu");hide("gameOver");hide("levelUp");show("hud");$("pause").classList.remove("hidden");music();if(audio?.state==="suspended")audio.resume();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function finish(){running=false;paused=true;$("pause").classList.add("hidden");hide("hud");saveScore();drawScores();$("final").textContent=`${name} – ${score} Punkte`;show("gameOver")}
$("startForm").addEventListener("submit",e=>{e.preventDefault();start()});
$("continue").addEventListener("click",()=>{level++;caught=0;muscle=1+level*.12;$("level").textContent=level;$("caught").textContent=0;hide("levelUp");paused=false;last=performance.now();});
$("again").addEventListener("click",start);
$("back").addEventListener("click",()=>{hide("gameOver");show("menu");drawScores()});
$("pause").addEventListener("click",()=>{paused=!paused;$("pause").textContent=paused?"▶":"Ⅱ";if(!paused){last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}});
function move(v){target=Math.max(45,Math.min(W-45,v))}
canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture?.(e.pointerId);move(e.clientX)});
canvas.addEventListener("pointermove",e=>{if(e.buttons)move(e.clientX)});
addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes(document.activeElement?.tagName))return;let k=e.key.toLowerCase();if(k==="arrowleft"||k==="a"){e.preventDefault();move(target-75)}if(k==="arrowright"||k==="d"){e.preventDefault();move(target+75)}if(k===" "&&running){paused=!paused;$("pause").textContent=paused?"▶":"Ⅱ";if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}}});
drawScores();draw();
})();
</script>
</body>
</html>
