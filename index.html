<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NamNam Food Racer</title>
<style>
:root{--road:#30343a;--red:#e82b4c;--yellow:#ffd72e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#159fe8;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#game{position:fixed;inset:0;overflow:hidden;touch-action:none;background:linear-gradient(#159fe8 0 49%,#6ac84d 50% 100%)}
.sky{position:absolute;inset:0 0 46%;overflow:hidden;background:linear-gradient(#159fe8,#8fe0f7)}
.sun{position:absolute;width:90px;height:90px;border-radius:50%;background:#ffe875;right:8%;top:11%;box-shadow:0 0 40px #fff5a0}
.cloud{position:absolute;background:#fff;opacity:.8;border-radius:999px;filter:blur(.2px)}
.c1{width:150px;height:36px;left:-20px;top:19%}.c2{width:180px;height:42px;right:-40px;top:27%}.c3{width:125px;height:30px;left:38%;top:12%}
.mountains{position:absolute;left:0;right:0;bottom:-3%;height:55%;opacity:.75}
.mountains:before,.mountains:after{content:"";position:absolute;bottom:0;border-style:solid;border-width:0 0 190px 180px;border-color:transparent transparent #578f9b transparent}
.mountains:before{left:4%;transform:scale(1.5)}.mountains:after{right:0;transform:scale(1.25) rotateY(180deg)}
.grass{position:absolute;inset:46% 0 0;background:linear-gradient(#76cf52,#398b31)}
.grass:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(70deg,transparent 0 35px,#ffffff0a 36px 38px)}
.track-wrap{position:absolute;inset:30% 0 0;perspective:650px;overflow:hidden}
.track{position:absolute;left:50%;top:-4%;width:82%;height:110%;transform:translateX(-50%) rotateX(47deg);transform-origin:50% 0;background:#30343a;box-shadow:0 0 0 10px #24282c;overflow:hidden}
.track:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(to bottom,transparent 0 70px,#f5e9a3 71px 79px,transparent 80px 155px);opacity:.95}
.lane1,.lane2{position:absolute;top:0;bottom:0;width:7px;background:#f5e9a3;left:33.333%;transform:translateX(-50%);opacity:.95}
.lane2{left:66.666%}
.kerb{position:absolute;top:0;bottom:0;width:26px;background:repeating-linear-gradient(to bottom,#fff 0 28px,#fff 28px 28px,#e63249 28px 56px);z-index:2}
.kl{left:-1px}.kr{right:-1px}
.grandstand{position:absolute;z-index:2;left:0;top:43%;width:27%;height:18%;background:linear-gradient(#c8cbd0 0 20%,#203f59 21% 100%);border-radius:0 14px 14px 0;box-shadow:inset 0 18px #e7e7e7}
.flags{position:absolute;z-index:3;left:5%;top:34%;font-size:20px;letter-spacing:10px}
.bridge{position:absolute;z-index:4;left:50%;top:37%;transform:translateX(-50%);width:74%;height:52px;border:7px solid #444;background:#f5f5ed;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:1000;color:#c62b42;box-shadow:0 7px 0 #222}
.bridge span{color:#222;margin-left:7px}
.food{position:absolute;z-index:8;left:50%;top:27%;font-size:38px;filter:drop-shadow(0 5px 3px #0005);transition:none;pointer-events:none}
#car{position:absolute;z-index:10;left:50%;bottom:6%;width:235px;height:180px;transform:translateX(-50%);transition:left .09s linear;filter:drop-shadow(0 16px 8px #0007)}
.car-shadow{position:absolute;left:10%;right:10%;bottom:0;height:28px;border-radius:50%;background:#0007}
.wheel{position:absolute;width:45px;height:80px;border-radius:18px;background:linear-gradient(90deg,#0b0b0b,#303030,#0b0b0b);bottom:20px;z-index:1}
.wl{left:0}.wr{right:0}
.body{position:absolute;left:10px;right:10px;bottom:15px;height:105px;border-radius:55px 55px 22px 22px;background:linear-gradient(155deg,#ff3d5b 0,#d81b43 45%,#84132f 100%);border:3px solid #7e102d;z-index:2}
.stripe{position:absolute;left:50%;top:0;bottom:0;width:25px;transform:translateX(-50%);background:#fff;opacity:.95}
.nose{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);width:82px;height:48px;background:#c7153a;clip-path:polygon(18% 0,82% 0,100% 100%,0 100%);z-index:3}
.spoiler{position:absolute;left:0;right:0;bottom:3px;height:13px;background:#181b1e;border-radius:6px;z-index:4}
.cockpit{position:absolute;z-index:5;left:50%;top:-9px;width:100px;height:76px;transform:translateX(-50%);border-radius:50% 50% 45% 45%;background:#071a27;border:8px solid #0a1218;overflow:hidden;box-shadow:inset 0 0 0 4px #51cbe6}
.face{position:absolute;left:50%;top:-10px;width:105px;height:126px;transform:translateX(-50%);object-fit:cover;object-position:50% 5%}
.roll{position:absolute;left:50%;top:-12px;width:108px;height:75px;transform:translateX(-50%);border:8px solid #0a1218;border-bottom:0;border-radius:55px 55px 0 0;z-index:6}
#hud{position:absolute;z-index:15;top:max(9px,env(safe-area-inset-top));left:9px;right:9px;display:flex;gap:7px}
.box{flex:1;text-align:center;background:#102f4c;color:#fff;border:3px solid #7694a8;border-radius:16px;padding:5px 2px;box-shadow:0 5px 0 #061c2d;font-weight:1000;font-size:12px}
.box b{display:block;color:#ffd72e;font-size:27px;line-height:1.05}
#nam{position:absolute;z-index:20;left:50%;top:53%;transform:translate(-50%);font-size:48px;font-weight:1000;color:#ff5b2e;text-shadow:3px 3px #fff,-2px -2px #fff;opacity:0;pointer-events:none}
#nam.show{animation:nam .72s ease-out}
@keyframes nam{0%{opacity:0;transform:translate(-50%) scale(.2) rotate(-8deg)}20%{opacity:1;transform:translate(-50%) scale(1.15) rotate(4deg)}100%{opacity:0;transform:translate(-50%,-100px) scale(.9)}}
.controls{position:absolute;z-index:16;left:16px;right:16px;bottom:max(14px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;pointer-events:none}
.ctrl{width:70px;height:70px;border:2px solid #ffffff99;border-radius:22px;background:#102f4ccc;color:#fff;font-size:45px;line-height:60px;text-align:center;pointer-events:auto}
#menu{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:#09243ad9;padding:20px}
.card{width:min(92vw,430px);background:#fffdf7;border-radius:28px;padding:25px;text-align:center;box-shadow:0 25px 70px #0008}
.title{font-size:58px;font-weight:1000;line-height:.9}.foodline{font-size:34px;margin:16px}
button{width:100%;padding:15px;border:0;border-radius:16px;background:#ff6542;color:#fff;font-size:20px;font-weight:1000;box-shadow:0 5px #b93d29}
.small{font-size:13px;font-weight:750;color:#40515e}
</style></head>

<div id="menu"><div class="card"><div class="title">🏎️ NAMNAM!</div><h2>FOOD RACER</h2><div style="font-size:75px">🏁🏎️💨</div><div class="foodline">🍟 🍌 🧇 🍦 🍉 🍪 🍎</div><p><b>Nur links und rechts.</b><br>Fang das Essen auf der Rennstrecke!</p><button id="start">🏁 RENNEN STARTEN!</button><p class="small">Tipp: Wischen oder die Pfeile benutzen.</p></div></div>

<script>
(()=>{
const foodLayer=document.getElementById("foodLayer"),car=document.getElementById("car"),nam=document.getElementById("nam");
const foods=[["🍟",10],["🍌",15],["🧇",20],["🍦",25],["🍉",30],["🍪",35],["🍎",40]];
let running=false,level=1,score=0,got=0,carX=50,target=50,last=0,spawnT=0,items=[],raf=0;
function hud(){scoreEl.textContent=score;levelEl.textContent=level;gotEl.textContent=got+"/20"}
const scoreEl=document.getElementById("score"),levelEl=document.getElementById("level"),gotEl=document.getElementById("got");
function setCar(x){target=Math.max(25,Math.min(75,x))}
function move(dx){setCar(target+dx)}
function spawn(){
 const f=foods[Math.floor(Math.random()*foods.length)],lane=Math.floor(Math.random()*3);
 const el=document.createElement("div");el.className="food";el.textContent=f[0];
 el.style.left=(25+lane*25)+"%";el.style.top="28%";foodLayer.appendChild(el);
 items.push({el,lane,z:0,p:f[1],x:25+lane*25});
}
function eat(item,index){
 score+=item.p;got++;item.el.remove();items.splice(index,1);hud();
 nam.textContent="NAMNAM! +"+item.p;nam.classList.remove("show");void nam.offsetWidth;nam.classList.add("show");
 if(got>=20){got=0;level++;hud();items.forEach(i=>i.el.remove());items=[]}
}
function frame(t){
 if(!running)return;const dt=Math.min(.035,(t-last)/1000);last=t;
 carX+=(target-carX)*Math.min(1,dt*15);car.style.left=carX+"%";
 spawnT+=dt;
 if(spawnT>Math.max(.42,.92-level*.065)){spawnT=0;spawn()}
 for(let i=items.length-1;i>=0;i--){
  const a=items[i];a.z+=(.00063+level*.000075)*dt*1000;
  const top=28+a.z*68, scale=.55+a.z*1.55;
  a.el.style.top=top+"%";a.el.style.transform="translate(-50%,-50%) scale("+scale+")";
  // perspective lanes converge toward center; interpolate x toward center as z approaches 0.
  const x=a.x+(50-a.x)*Math.max(0,1-a.z);
  a.el.style.left=x+"%";
  if(a.z>.84&&Math.abs(x-carX)<9){eat(a,i)}
  else if(a.z>1.08){a.el.remove();items.splice(i,1)}
 }
 requestAnimationFrame(frame)
}
function start(){document.getElementById("menu").style.display="none";running=true;last=performance.now();hud();requestAnimationFrame(frame)}
document.getElementById("start").onclick=start;
function drag(e){setCar((e.clientX/innerWidth)*100)}
document.getElementById("game").addEventListener("pointerdown",drag);
document.getElementById("game").addEventListener("pointermove",e=>{if(e.buttons)drag(e)});
document.getElementById("left").onclick=()=>move(-10);document.getElementById("right").onclick=()=>move(10);
addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")move(-8);if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")move(8)});
})();
</script></body></html>
