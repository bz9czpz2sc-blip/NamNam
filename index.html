<title>NamNam!</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif}
#game{height:100%;background:linear-gradient(#20a8ed 0 70%,#8fdff7 70% 71%,#75d34f 71%);position:relative;overflow:hidden;touch-action:none}
.cloud{position:absolute;width:150px;height:35px;background:#fff;border-radius:30px;opacity:.8}.c1{top:18%;left:-20px}.c2{top:32%;right:-35px}.c3{top:25%;left:35%}
.hud{position:absolute;top:10px;left:8px;right:8px;display:flex;gap:7px;z-index:10}.box{flex:1;background:#12324e;color:#fff;border:3px solid #7895a8;border-radius:17px;text-align:center;padding:5px;font-weight:900}.box b{display:block;color:#ffd72e;font-size:24px}
#pause{position:absolute;z-index:12;right:10px;top:75px;width:52px;height:48px;border:0;border-radius:15px;background:#fff;font-size:20px;font-weight:900;box-shadow:0 5px #c84d2b}
.food{position:absolute;z-index:6;font-size:52px;line-height:1;transform:translateX(-50%)}
#player{position:absolute;z-index:8;bottom:20px;left:50%;width:170px;height:190px;transform:translateX(-50%);transition:filter .1s}
#body{position:absolute;z-index:1;left:50%;bottom:-42px;width:270px;height:235px;transform:translateX(-50%);opacity:0;pointer-events:none}
.shirt{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:158px;height:158px;border-radius:44px 44px 28px 28px;background:linear-gradient(145deg,#ef3b58,#9f1434);color:#fff;text-align:center;font-size:25px;font-weight:1000;line-height:1.05;padding-top:56px;box-shadow:inset 0 -9px 0 #82132c,0 8px 0 rgba(0,0,0,.08)}
.arm{position:absolute;bottom:18px;width:72px;height:148px;border-radius:45px;background:linear-gradient(90deg,#a95732 0%,#e29a59 52%,#b96438 100%);box-shadow:inset -6px -5px 0 #9b4f30}
.arm.left{left:2px;transform:rotate(13deg)}.arm.right{right:2px;transform:rotate(-13deg)}
.fist{position:absolute;bottom:-8px;width:48px;height:50px;border-radius:50%;background:#c6733e;box-shadow:inset -4px -4px 0 #a95b35}
.arm.left .fist{left:1px}.arm.right .fist{right:1px}
#player.level2 #body{opacity:1;animation:bodyIn .65s cubic-bezier(.2,.9,.25,1) forwards}
#player.level2 #head{width:138px;height:154px;position:absolute;z-index:4;left:50%;top:0;transform:translateX(-50%)}
@keyframes bodyIn{0%{opacity:0;transform:translateX(-50%) scale(.45) translateY(35px)}70%{opacity:1;transform:translateX(-50%) scale(1.05)}100%{opacity:1;transform:translateX(-50%) scale(1)}}70%{opacity:1;transform:translateX(-50%) scale(1.02)}100%{opacity:1;transform:translateX(-50%) scale(.9)}}
#head{width:100%;height:100%;object-fit:contain}
#mouth{position:absolute;left:51%;top:57%;width:22px;height:7px;background:#451521;border-radius:50%;opacity:0;transform:translate(-50%,-50%) scaleY(.2)}
.chomp #head{animation:chomp .38s ease}.chomp #mouth{animation:mouth .38s ease}
@keyframes chomp{0%{transform:scale(1)}25%{transform:scale(1.06,.94)}55%{transform:scale(.97,1.04)}100%{transform:scale(1)}}
@keyframes mouth{0%{opacity:0;transform:translate(-50%,-50%) scaleY(.2)}25%{opacity:1;transform:translate(-50%,-50%) scaleY(5)}55%{opacity:1;transform:translate(-50%,-50%) scaleY(3)}100%{opacity:0;transform:translate(-50%,-50%) scaleY(.2)}}
#nam{position:absolute;z-index:20;left:50%;top:60%;font-size:52px;font-weight:1000;color:#ff572f;text-shadow:3px 3px #fff,-2px -2px #fff;opacity:0;pointer-events:none}
.pop #nam{animation:pop .75s ease-out}@keyframes pop{0%{opacity:0;transform:translate(-50%) scale(.2)}20%{opacity:1;transform:translate(-50%) scale(1.2)}100%{opacity:0;transform:translate(-50%,-90px) scale(.9)}}
#levelup{position:absolute;inset:0;z-index:45;background:#17364e77;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.levelcard{background:#fffdf7;border-radius:28px;padding:25px;width:90%;max-width:420px;text-align:center;box-shadow:0 20px 60px #092a4055}.leveltitle{font-size:42px;font-weight:1000;line-height:.9}.muscles{font-size:80px;margin:12px}.shout{font-size:30px;font-weight:1000;color:#ff552f;margin-bottom:12px}
.hidden{display:none!important}
#start{position:absolute;inset:0;z-index:50;background:#17364e77;display:flex;align-items:center;justify-content:center}.card{background:#fffdf7;border-radius:28px;padding:25px;width:90%;max-width:420px;text-align:center}.title{font-size:58px;font-weight:1000}.foods{font-size:32px;margin:15px}button{width:100%;padding:14px;border:0;border-radius:15px;background:#ff7043;color:#fff;font-size:20px;font-weight:1000}

<div id="levelup" class="hidden"><div class="levelcard"><div class="leveltitle">LEVEL GESCHAFFT!</div><div class="muscles">💪😎💪</div><div class="shout">NAAAAAMNAM!!!</div><button id="continue">WEITER!</button></div></div>
<div id="start"><div class="card"><div class="title">🍴 NAMNAM!</div><p>Fang das Essen mit deinem Gesicht!</p><div class="foods">🍟 🍌 🧇 🍦 🍉 🍪 🍎</div><button id="go">START!</button></div></div>
<script>
(()=>{const G=document.getElementById("game"),F=document.getElementById("field"),P=document.getElementById("player"),foods=[["🍟",10],["🍌",15],["🧇",20],["🍦",25],["🍉",30],["🍪",35],["🍎",40]];
let x=innerWidth/2,target=x,items=[],score=0,got=0,level=1,last=0,timer=0,running=false,paused=false,levelBusy=false;
function pos(){P.style.left=x+"px";if(level>=2) P.classList.add("level2"); else P.classList.remove("level2")}addEventListener("resize",()=>{target=Math.max(70,Math.min(innerWidth-70,target));pos()});
function spawn(){let a=foods[Math.floor(Math.random()*foods.length)],e=document.createElement("div");e.className="food";e.textContent=a[0];e.style.left=(30+Math.random()*(innerWidth-60))+"px";e.style.top="-65px";F.appendChild(e);items.push({e:e,x:parseFloat(e.style.left),y:-65,p:a[1],v:170+level*35})}
function catchIt(i){let f=items[i];score+=f.p;got++;document.getElementById("score").textContent=score;document.getElementById("got").textContent=got;
f.e.remove();items.splice(i,1);P.classList.remove("chomp");void P.offsetWidth;P.classList.add("chomp");G.classList.remove("pop");void G.offsetWidth;G.classList.add("pop");
if(got>=20){setTimeout(()=>{alert("LEVEL GESCHAFFT! 🎉\nNAAAAAMNAM!!!");level++;got=0;document.getElementById("level").textContent=level;document.getElementById("got").textContent=0},400)}}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.033);last=t;if(!paused){x+=(target-x)*Math.min(1,dt*16);pos();timer+=dt;if(timer>Math.max(.38,.85-level*.06)){timer=0;spawn()}
let r=P.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height*.48;
for(let i=items.length-1;i>=0;i--){let f=items[i];f.y+=f.v*dt;f.e.style.top=f.y+"px";if(Math.hypot(f.x-cx,f.y-cy)<75)catchIt(i);else if(f.y>innerHeight+80){f.e.remove();items.splice(i,1)}}}requestAnimationFrame(loop)}
G.addEventListener("pointerdown",e=>target=e.clientX);G.addEventListener("pointermove",e=>{if(e.buttons)target=e.clientX});
document.getElementById("go").onclick=()=>{document.getElementById("start").style.display="none";running=true;last=performance.now();requestAnimationFrame(loop)};
document.getElementById("continue").onclick=()=>{level++;got=0;levelBusy=false;paused=false;if(level>=2) P.classList.add("level2"); else P.classList.remove("level2");document.getElementById("level").textContent=level;document.getElementById("got").textContent=0;items.forEach(q=>q.e.remove());items=[];timer=0;document.getElementById("levelup").classList.add("hidden");last=performance.now()};
document.getElementById("pause").onclick=()=>paused=!paused;pos()})();
</script></div></body></html>
