<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NamNam!</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#26aef0}
#game{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:fixed;z-index:10;top:max(10px,env(safe-area-inset-top));left:9px;right:9px;display:flex;gap:7px}
.hudbox{flex:1;background:#102f4b;border:3px solid #7191a6;border-radius:17px;color:white;text-align:center;padding:5px 3px;box-shadow:0 5px 0 #0b263c;font-weight:1000;font-size:12px;letter-spacing:.3px}
.hudbox b{display:block;color:#ffd72e;font-size:24px;line-height:1.05}
.pause{position:fixed;z-index:11;right:12px;top:76px;width:50px;height:48px;border:0;border-radius:16px;background:#fff;color:#18354d;font-size:20px;font-weight:1000;box-shadow:0 5px 0 #c94628}
.overlay{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:18px;background:#08324d88;backdrop-filter:blur(4px)}
.card{width:min(92vw,440px);background:#fffdf7;border-radius:28px;padding:24px;text-align:center;box-shadow:0 20px 70px #082b4155}
.title{font-size:clamp(44px,12vw,68px);font-weight:1000;line-height:.9;margin-bottom:10px}
.sub{font-size:18px;font-weight:850}
.foodline{font-size:31px;margin:15px 0}
input{width:100%;padding:13px;border:3px solid #d9e4ea;border-radius:15px;font-size:18px;margin:7px 0 10px}
button{width:100%;padding:13px;border:0;border-radius:16px;background:#ff7043;color:#fff;font-size:19px;font-weight:1000;box-shadow:0 5px 0 #c54d2b}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c54d2b}
.dark{margin-top:10px;background:#17334c;box-shadow:0 5px 0 #0a2234}
.board{margin-top:14px;background:#eef5f8;border-radius:15px;padding:10px;text-align:left}
.row{display:flex;justify-content:space-between;padding:4px;font-weight:850}
.help{font-size:13px;color:#667985;margin-top:10px}
.hidden{display:none!important}
#namnam{position:fixed;z-index:20;pointer-events:none;left:50%;top:61%;font-size:clamp(32px,9vw,56px);font-weight:1000;color:#ff552f;text-shadow:3px 3px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff;animation:pop .75s ease-out forwards}
#plus{position:fixed;z-index:20;pointer-events:none;left:50%;top:68%;font-size:clamp(23px,7vw,40px);font-weight:1000;color:#fff;text-shadow:2px 2px #18354d;animation:float .75s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translate(-50%,15px) scale(.25) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,0) scale(1.2) rotate(4deg)}100%{opacity:0;transform:translate(-50%,-90px) scale(.9)}}
@keyframes float{0%{opacity:0;transform:translate(-50%,15px) scale(.7)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-85px) scale(1)}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud" class="hud hidden">
 <div class="hudbox">⭐ PUNKTE<b id="score">0</b></div>
 <div class="hudbox">LEVEL<b id="level">1</b></div>
 <div class="hudbox">🍴 GEFANGEN<b><span id="caught">0</span>/20</b></div>
</div>
<button id="pause" class="pause hidden">Ⅱ</button>

<section id="menu" class="overlay">
 <div class="card">
  <div class="title">🍴 NAMNAM!</div>
  <div class="sub">Fang das Essen mit deinem Gesicht!</div>
  <div class="foodline">🍟 🍌 🧇 🍦 🍉 🍪 🍎</div>
  <form id="form"><input id="player" maxlength="14" placeholder="Dein Name" required><button>🚀 LOS GEHT'S!</button></form>
  <div class="board"><b>🏆 HIGHSCORE</b><div id="scores"></div></div>
  <div class="help">📱 Finger links/rechts ziehen · ⌨️ ← → / A D<br>🍽️ 20 Treffer pro Level</div>
 </div>
</section>

<section id="levelup" class="overlay hidden">
 <div class="card">
  <div class="title">LEVEL GESCHAFFT!</div>
  <div style="font-size:88px">💪😎💪</div>
  <div style="font-size:30px;font-weight:1000">NAAAAAMNAM!!!</div>
  <p>Der Kopf wird kleiner – dafür gibt's jetzt Muskeln! 💪</p>
  <button id="next">WEITER! 🔥</button>
 </div>
</section>

<section id="gameover" class="overlay hidden">
 <div class="card">
  <div class="title">🏆 FERTIG!</div>
  <div id="final" style="font-size:25px;font-weight:1000;margin:16px"></div>
  <button id="again">🔄 NOCHMAL!</button>
  <button id="home" class="dark">🏠 MENÜ</button>
 </div>
</section>

const img=new Image(); img.src=FACE;
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const TYPES=[
 ["🍟","Pommes",10],["🍌","Banane",15],["🧇","Waffel",20],
 ["🍦","Eis",25],["🍉","Melone",30],["🍪","Keks",35],["🍎","Apfel",40]
];

let W=0,H=0,D=1,px=0,target=0;
let running=false,paused=false,last=0,spawnClock=0,raf=0;
let score=0,caught=0,missed=0,level=1,headScale=1;
let items=[],mouth=0,chew=0,name="NamNam",audio=null;

const $=id=>document.getElementById(id);
const show=id=>$(id).classList.remove("hidden");
const hide=id=>$(id).classList.add("hidden");

function resize(){
 D=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
 canvas.width=W*D; canvas.height=H*D; ctx.setTransform(D,0,0,D,0,0);
 if(!running){px=W/2;target=px}
}
addEventListener("resize",resize); resize();

function scores(){
 try{return JSON.parse(localStorage.getItem("namnam_scores")||"[]")}catch{return[]}
}
function safe(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function drawScores(){
 const a=scores();
 $("scores").innerHTML=a.length?a.slice(0,5).map((x,i)=>`<div class="row"><span>${i+1}. ${safe(x.name)}</span><b>${x.score}</b></div>`).join(""):"<div class='help'>Noch keine Rekorde 😎</div>";
}
function save(){
 const a=scores(); a.push({name,score}); a.sort((a,b)=>b.score-a.score);
 try{localStorage.setItem("namnam_scores",JSON.stringify(a.slice(0,10)))}catch{}
}

function music(){
 if(audio)return;
 try{
  audio=new(window.AudioContext||window.webkitAudioContext)();
  const master=audio.createGain();master.gain.value=.028;master.connect(audio.destination);
  const notes=[261.6,329.6,392,329.6,440,392,329.6,261.6,293.7,349.2,440,349.2];
  let i=0;
  function beat(){
   let o=audio.createOscillator(),g=audio.createGain();
   o.type="triangle";o.frequency.value=notes[i++%notes.length];
   g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.65,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.17);
   o.connect(g);g.connect(master);o.start();o.stop(audio.currentTime+.19);setTimeout(beat,215);
  }beat();
 }catch{}
}
function tone(freq=700,d=.12){
 if(!audio)return;
 let o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=freq;g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+d);o.stop(audio.currentTime+d+.01);
}
function effects(points){
 const a=document.createElement("div");a.id="namnam";a.textContent="NAMNAM!";document.body.appendChild(a);
 const b=document.createElement("div");b.id="plus";b.textContent="+"+points;document.body.appendChild(b);
 setTimeout(()=>{a.remove();b.remove()},800);
}

function reset(){
 score=0;caught=0;missed=0;level=1;headScale=1;items=[];mouth=0;chew=0;spawnClock=0;px=W/2;target=px;
 $("score").textContent=0;$("caught").textContent=0;$("level").textContent=1;
}
function spawn(){
 const f=TYPES[Math.floor(Math.random()*TYPES.length)];
 items.push({e:f[0],p:f[2],x:35+Math.random()*(W-70),y:-50,s:35+Math.random()*9,
  vy:145+level*38+Math.random()*60,rot:(Math.random()-.5)*.8,catching:false});
}

function background(){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,"#20a9ed");g.addColorStop(.70,"#8edcf7");g.addColorStop(.705,"#76d24f");g.addColorStop(1,"#56aa39");
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle="#ffffffc0";
 for(let i=0;i<6;i++){const x=(i*151+40)%W,y=80+(i%3)*72;
  ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.arc(x+25,y+5,18,0,7);ctx.arc(x-25,y+8,18,0,7);ctx.fill();
 }
}

function drawPlayer(){
 // player anchored at bottom, body behind head from level 2
 const faceH=175*headScale,faceW=150*headScale;
 const faceY=H-145-faceH/2;
 const bodyY=faceY+faceH*.58;

 if(level>=2){
  ctx.save();ctx.translate(px,bodyY+55);
  const s=Math.min(1+(level-2)*.045,1.28);ctx.scale(s,s);

  // shadow
  ctx.fillStyle="#00000022";ctx.beginPath();ctx.ellipse(0,112,105,18,0,0,7);ctx.fill();

  // cape/shirt
  ctx.fillStyle="#d91f3c";ctx.beginPath();ctx.roundRect(-70,-18,140,145,25);ctx.fill();

  // chest
  ctx.fillStyle="#f09a54";ctx.beginPath();ctx.ellipse(0,28,48,61,0,0,7);ctx.fill();

  // huge cartoon arms
  ctx.fillStyle="#d47d43";
  ctx.beginPath();ctx.ellipse(-72,20,34,73,-.18,0,7);ctx.ellipse(72,20,34,73,.18,0,7);ctx.fill();
  ctx.fillStyle="#e69a58";
  ctx.beginPath();ctx.ellipse(-82,78,27,32,-.25,0,7);ctx.ellipse(82,78,27,32,.25,0,7);ctx.fill();

  // fists
  ctx.fillStyle="#c56f3b";ctx.beginPath();ctx.arc(-84,94,19,0,7);ctx.arc(84,94,19,0,7);ctx.fill();

  // shirt text
  ctx.fillStyle="#fff";ctx.textAlign="center";ctx.textBaseline="middle";ctx.font="900 24px system-ui";
  ctx.fillText("NAM",0,30);ctx.fillText("NAM!",0,59);
  ctx.restore();
 }

 // supplied real head
 let bounce=chew>0?1+Math.sin(chew*Math.PI)*.035:1;
 ctx.save();ctx.translate(px,faceY);ctx.scale(bounce,2-bounce);
 ctx.drawImage(img,-faceW/2,-faceH/2,faceW,faceH);ctx.restore();

 // animated mouth: subtle overlay follows the actual mouth location
 if(mouth>0){
  const mx=px+faceW*.015,my=faceY+faceH*.292;
  const open=Math.sin(mouth*Math.PI);
  ctx.fillStyle="#421521";
  ctx.beginPath();ctx.ellipse(mx,my,faceW*.105,faceH*(.014+.048*open),0,0,7);ctx.fill();
  ctx.fillStyle="#fff";
  ctx.beginPath();ctx.ellipse(mx,my-faceH*.012,faceW*.052,faceH*.012,0,0,7);ctx.fill();
 }
}

function draw(){
 ctx.clearRect(0,0,W,H);background();
 ctx.textAlign="center";ctx.textBaseline="middle";
 for(const f of items){
  ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(f.y*.018)*f.rot);ctx.font=f.s+"px serif";ctx.fillText(f.e,0,0);ctx.restore();
 }
 drawPlayer();
}

function loop(t){
 if(!running)return;
 const dt=Math.min((t-last)/1000,.035);last=t;
 if(!paused){
  px+=(target-px)*Math.min(1,dt*15);px=Math.max(48,Math.min(W-48,px));
  mouth=Math.max(0,mouth-dt*3.4);chew=Math.max(0,chew-dt*4);
  spawnClock+=dt;
  const interval=Math.max(.22,.78-(level-1)*.07);
  if(spawnClock>=interval){spawnClock=0;spawn()}

  const faceH=175*headScale,faceY=H-145-faceH/2;
  const catchR=Math.max(55,faceH*.39);

  for(let i=items.length-1;i>=0;i--){
   const f=items[i];
   f.y+=f.vy*dt;
   if(Math.hypot(f.x-px,f.y-faceY)<catchR+f.s*.34){
    score+=f.p;caught++;mouth=1;chew=1;effects(f.p);tone(560+f.p*5,.13);items.splice(i,1);
    $("score").textContent=score;$("caught").textContent=caught;
    if(caught>=20){paused=true;setTimeout(()=>show("levelup"),240)}
   }else if(f.y>H+70){
    missed++;items.splice(i,1);
    if(missed>=10){finish();return}
   }
  }
 }
 draw();raf=requestAnimationFrame(loop);
}

function start(){
 reset();name=($("player").value||"NamNam").trim().slice(0,14);running=true;paused=false;
 hide("menu");hide("levelup");hide("gameover");show("hud");$("pause").classList.remove("hidden");
 music();if(audio?.state==="suspended")audio.resume();
 last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop);
}
function nextLevel(){
 level++;caught=0;
 headScale=Math.max(.68,1-(level-1)*.09);
 $("level").textContent=level;$("caught").textContent=0;hide("levelup");paused=false;last=performance.now();
}
function finish(){
 running=false;paused=true;$("pause").classList.add("hidden");hide("hud");
 save();drawScores();$("final").textContent=name+" – "+score+" Punkte";show("gameover");
}

$("form").addEventListener("submit",e=>{e.preventDefault();start()});
$("next").onclick=nextLevel;$("again").onclick=start;
$("home").onclick=()=>{hide("gameover");show("menu");drawScores()};
$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"▶":"Ⅱ";if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}};

canvas.addEventListener("pointerdown",e=>{canvas.setPointerCapture?.(e.pointerId);target=e.clientX});
canvas.addEventListener("pointermove",e=>{if(e.buttons)target=e.clientX});
addEventListener("keydown",e=>{
 if(document.activeElement?.tagName==="INPUT")return;
 if(e.key==="ArrowLeft"||e.key.toLowerCase()==="a")target-=75;
 if(e.key==="ArrowRight"||e.key.toLowerCase()==="d")target+=75;
 if(e.key===" "&&running)$("pause").click();
});
drawScores();draw();
})();
</script>
