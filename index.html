<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,sans-serif;background:#61cdf5;color:#17324d}
#app{position:fixed;inset:0;overflow:hidden;touch-action:none;background:linear-gradient(#59caf5 0 70%,#83d35a 70%)}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.hud{position:absolute;z-index:4;top:max(9px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px}
.pill{flex:1;background:#17324dee;color:#fff;border:2px solid #ffffff55;border-radius:15px;text-align:center;padding:4px 2px;font-weight:900;font-size:11px}
.pill b{display:block;color:#ffd83d;font-size:21px;line-height:1.05}
.pause{position:absolute;z-index:5;right:10px;top:65px;width:44px;height:42px;border:0;border-radius:14px;background:#fff;color:#17324d;font-weight:1000;font-size:18px}
.screen{position:absolute;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:#17324d66;backdrop-filter:blur(5px)}
.card{width:min(92vw,430px);max-height:94%;overflow:auto;background:#fffdf7;border-radius:28px;padding:23px;text-align:center;box-shadow:0 20px 60px #17324d55}
.title{font-size:clamp(40px,11vw,62px);font-weight:1000;line-height:.9;margin-bottom:10px}
.sub{font-size:18px;font-weight:850}.foods{font-size:30px;margin:15px 0}
input{width:100%;padding:13px;font-size:18px;border:3px solid #dce6eb;border-radius:15px;margin:8px 0 10px;outline:0}
button{width:100%;padding:13px;border:0;border-radius:16px;background:#ff7043;color:#fff;font-size:19px;font-weight:1000;box-shadow:0 5px 0 #c84d2a}
button:active{transform:translateY(3px);box-shadow:0 2px 0 #c84d2a}.dark{background:#17324d;box-shadow:0 5px 0 #0a2030;margin-top:9px}
.board{margin-top:14px;padding:10px 13px;background:#edf5f8;border-radius:15px;text-align:left}.row{display:flex;justify-content:space-between;padding:4px;font-weight:850}
.help{font-size:13px;color:#647783;margin-top:10px}.hidden{display:none!important}
#toast{position:absolute;z-index:30;left:50%;top:62%;font-size:clamp(30px,9vw,52px);font-weight:1000;color:#ff542f;text-shadow:3px 3px #fff,-2px -2px #fff,2px -2px #fff,-2px 2px #fff;animation:pop .72s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,0) scale(.25) rotate(-8deg)}20%{opacity:1;transform:translate(-50%,-5px) scale(1.2) rotate(5deg)}100%{opacity:0;transform:translate(-50%,-90px) scale(.9)}}
</style></head><body><div id="app">
<canvas id="game"></canvas>

<button id="pause" class="pause hidden">Ⅱ</button>

const $=id=>document.getElementById(id),show=id=>$(id).classList.remove("hidden"),hide=id=>$(id).classList.add("hidden");
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;ctx.setTransform(D,0,0,D,0,0);if(!running){px=W/2;target=px}}addEventListener("resize",resize);resize();
function read(){try{return JSON.parse(localStorage.getItem("namnam_scores")||"[]")}catch{return[]}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function scores(){let a=read();$("scores").innerHTML=a.length?a.slice(0,5).map((v,i)=>`<div class="row"><span>${i+1}. ${esc(v.name)}</span><b>${v.score}</b></div>`).join(""):"<div class='help'>Noch keine Rekorde 😎</div>"}
function save(){let a=read();a.push({name,score});a.sort((a,b)=>b.score-a.score);try{localStorage.setItem("namnam_scores",JSON.stringify(a.slice(0,10)))}catch{}}
function music(){if(audio)return;try{audio=new(window.AudioContext||window.webkitAudioContext)();let master=audio.createGain();master.gain.value=.035;master.connect(audio.destination);let ns=[261.6,329.6,392,329.6,440,392,329.6,261.6,293.7,349.2,440,349.2],i=0;function beat(){let o=audio.createOscillator(),g=audio.createGain();o.type="triangle";o.frequency.value=ns[i++%ns.length];g.gain.setValueAtTime(.0001,audio.currentTime);g.gain.exponentialRampToValueAtTime(.65,audio.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.17);o.connect(g);g.connect(master);o.start();o.stop(audio.currentTime+.19);setTimeout(beat,215)}beat()}catch{}}
function blip(f=650){if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type="square";o.frequency.value=f;g.gain.value=.04;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,audio.currentTime+.14);o.stop(audio.currentTime+.15)}
function popup(t){let e=document.createElement("div");e.id="toast";e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),760)}
function reset(){score=0;caught=0;level=1;lives=3;headScale=1;items=[];mouth=0;chomp=0;spawn=0;px=W/2;target=px;$("score").textContent=0;$("got").textContent=0;$("lvl").textContent=1;$("lives").textContent=3}
function spawnFood(){let f=types[Math.floor(Math.random()*types.length)];items.push({e:f[0],p:f[1],x:30+Math.random()*(W-60),y:-50,s:34+Math.random()*9,vy:150+level*35+Math.random()*55,r:(Math.random()-.5)*.8})}
function draw(){ctx.clearRect(0,0,W,H);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#55c9f5");g.addColorStop(.69,"#bcefff");g.addColorStop(.695,"#83d15a");g.addColorStop(1,"#60b240");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
ctx.fillStyle="#ffffffbb";for(let i=0;i<6;i++){let q=(i*145+55)%W,y=90+(i%3)*65;ctx.beginPath();ctx.arc(q,y,25,0,7);ctx.arc(q+25,y+5,18,0,7);ctx.arc(q-25,y+7,17,0,7);ctx.fill()}
ctx.textAlign="center";ctx.textBaseline="middle";for(let f of items){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(Math.sin(f.y*.018)*f.r);ctx.font=f.s+"px serif";ctx.fillText(f.e,0,0);ctx.restore()}
const ground=H-10,fh=190*headScale,fw=158*headScale,fy=ground-fh/2-8;
if(level>1){let bs=Math.min(1+(level-2)*.05,1.35),by=fy+fh*.48;ctx.save();ctx.translate(px,by);ctx.scale(bs,bs);ctx.fillStyle="#d88c4c";ctx.beginPath();ctx.ellipse(0,50,62,86,0,0,7);ctx.fill();ctx.fillStyle="#b9733e";ctx.beginPath();ctx.ellipse(-58,5,28,65,-.22,0,7);ctx.ellipse(58,5,28,65,.22,0,7);ctx.fill();ctx.fillStyle="#17324d";ctx.beginPath();ctx.ellipse(-30,120,28,12,0,0,7);ctx.ellipse(30,120,28,12,0,0,7);ctx.fill();ctx.restore()}
let squash=chomp>0?1+Math.sin(chomp*Math.PI)*.035:1;ctx.save();ctx.translate(px,fy);ctx.scale(squash,2-squash);ctx.drawImage(img,-fw/2,-fh/2,fw,fh);ctx.restore();
// mouth overlay only during bite
if(mouth>0){let mx=px+fw*.055,my=fy+fh*.265,op=Math.sin(mouth*Math.PI);ctx.fillStyle="#551d2b";ctx.beginPath();ctx.ellipse(mx,my,fw*.11,fh*(.018+.042*op),0,0,7);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.ellipse(mx,my-fh*.012,fw*.055,fh*.011,0,0,7);ctx.fill()}
}
function loop(t){if(!running)return;let dt=Math.min((t-last)/1000,.035);last=t;if(!paused){px+=(target-px)*Math.min(1,dt*15);px=Math.max(45,Math.min(W-45,px));mouth=Math.max(0,mouth-dt*3.2);chomp=Math.max(0,chomp-dt*5);spawn+=dt;let gap=Math.max(.22,.78-(level-1)*.065);if(spawn>=gap){spawn=0;spawnFood()}
const ground=H-10,fh=190*headScale,fy=ground-fh/2-8,catchR=Math.max(52,fh*.37);
for(let i=items.length-1;i>=0;i--){let f=items[i];f.y+=f.vy*dt;if(Math.hypot(f.x-px,f.y-fy)<catchR+f.s*.35){score+=f.p;caught++;mouth=1;chomp=1;popup("NAMNAM! +"+f.p);blip(520+f.p*4);items.splice(i,1);$("score").textContent=score;$("got").textContent=caught;if(caught>=20){paused=true;setTimeout(()=>show("levelup"),220)}}else if(f.y>H+60){items.splice(i,1);lives--;$("lives").textContent=lives;if(lives<=0){finish();return}}}}draw();raf=requestAnimationFrame(loop)}
function start(){reset();name=($("name").value||"NamNam").trim().slice(0,14);running=true;paused=false;hide("menu");hide("over");hide("levelup");show("hud");$("pause").classList.remove("hidden");music();if(audio?.state==="suspended")audio.resume();last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}
function nextLevel(){level++;caught=0;headScale=Math.max(.62,1-(level-1)*.10);$("lvl").textContent=level;$("got").textContent=0;hide("levelup");paused=false;last=performance.now()}
function finish(){running=false;paused=true;$("pause").classList.add("hidden");hide("hud");save();scores();$("final").textContent=name+" – "+score+" Punkte";show("over")}
$("form").addEventListener("submit",e=>{e.preventDefault();start()});$("cont").onclick=nextLevel;$("again").onclick=start;$("back").onclick=()=>{hide("over");show("menu");scores()};$("pause").onclick=()=>{paused=!paused;$("pause").textContent=paused?"▶":"Ⅱ";if(!paused){last=performance.now();raf=requestAnimationFrame(loop)}};
c.addEventListener("pointerdown",e=>{c.setPointerCapture?.(e.pointerId);target=e.clientX});c.addEventListener("pointermove",e=>{if(e.buttons)target=e.clientX});
addEventListener("keydown",e=>{if(document.activeElement?.tagName==="INPUT")return;let k=e.key.toLowerCase();if(k==="arrowleft"||k==="a")target-=75;if(k==="arrowright"||k==="d")target+=75;if(k===" "&&running)$("pause").click()});
scores();draw();
})();
</script></body></html>
