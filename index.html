let W=0,H=0,D=1,carX=0,targetX=0,level=1,score=0,caught=0,last=0,spawnClock=0,scroll=0,running=false,items=[];
const foods=[["🍟",10],["🍌",15],["🧇",20],["🍦",25],["🍉",30],["🍪",35],["🍎",40]];
function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);cv.width=W*D;cv.height=H*D;ctx.setTransform(D,0,0,D,0,0);if(!carX)carX=W/2;targetX=Math.max(W*.23,Math.min(W*.77,targetX));carX=Math.max(W*.23,Math.min(W*.77,carX))}
addEventListener("resize",resize);resize();

function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function roadPoint(y){
 const p=Math.max(0,Math.min(1,(y-H*.31)/(H*.69)));
 return {l:W*.43+(W*.03-W*.43)*p,r:W*.57+(W*.97-W*.57)*p}
}
function scenery(){
 let sky=ctx.createLinearGradient(0,0,0,H);sky.addColorStop(0,"#159fe7");sky.addColorStop(.55,"#8edff7");sky.addColorStop(.56,"#6cc94d");sky.addColorStop(1,"#2f8a2f");
 ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

 // distant mountains
 ctx.fillStyle="#6aa9a0";ctx.beginPath();ctx.moveTo(0,H*.34);ctx.lineTo(W*.16,H*.22);ctx.lineTo(W*.30,H*.34);ctx.lineTo(W*.45,H*.20);ctx.lineTo(W*.64,H*.34);ctx.lineTo(W*.80,H*.23);ctx.lineTo(W,H*.34);ctx.lineTo(W,H*.47);ctx.lineTo(0,H*.47);ctx.closePath();ctx.fill();
 // trees and flags on both sides
 for(let i=0;i<13;i++){
  let y=H*.33+i*42-(scroll%42),p=Math.max(0,Math.min(1,(y-H*.31)/(H*.69))),rp=roadPoint(y), side=i%2?-1:1;
  let tx=side<0?rp.l-30-45*p:rp.r+30+45*p;
  ctx.fillStyle="#236f35";ctx.beginPath();ctx.arc(tx,y,17+12*p,0,Math.PI*2);ctx.arc(tx-12,y+10,14+9*p,0,Math.PI*2);ctx.arc(tx+12,y+11,14+9*p,0,Math.PI*2);ctx.fill();
  ctx.fillStyle="#704a2b";ctx.fillRect(tx-3,y+20,6,24);
 }
 // grandstand
 ctx.fillStyle="#e6e6e3";rr(W*.04,H*.34,W*.18,H*.11,6);ctx.fill();
 for(let i=0;i<5;i++){ctx.fillStyle=i%2?"#e52e47":"#244b70";ctx.fillRect(W*.055+i*W*.032,H*.36,W*.022,H*.075)}
 // road
 const topY=H*.31, botY=H;
 ctx.fillStyle="#30343a";ctx.beginPath();ctx.moveTo(W*.43,topY);ctx.lineTo(W*.57,topY);ctx.lineTo(W*.97,botY);ctx.lineTo(W*.03,botY);ctx.closePath();ctx.fill();
 // road texture
 ctx.fillStyle="rgba(255,255,255,.04)";for(let i=0;i<12;i++){let y=topY+i*90-(scroll%90),p=(y-topY)/(botY-topY),q=roadPoint(y);ctx.fillRect(q.l,y,q.r-q.l,2)}
 // curbs
 for(let y=topY-50+(scroll%48);y<H+48;y+=48){
   let q=roadPoint(y),p=(y-topY)/(botY-topY),w=9+18*p;
   ctx.fillStyle="#fff";ctx.fillRect(q.l-w,y,w,23);ctx.fillRect(q.r,y,w,23);
   ctx.fillStyle="#e93248";ctx.fillRect(q.l-w,y+23,w,23);ctx.fillRect(q.r,y+23,w,23);
 }
 // lane markings
 ctx.fillStyle="#f5e7a0";
 for(let y=topY-70+(scroll%100);y<H;y+=100){
  let q=roadPoint(y),p=(y-topY)/(botY-topY);
  let x1=q.l+(q.r-q.l)/3,x2=q.l+(q.r-q.l)*2/3;
  ctx.fillRect(x1-3,y,6,38+24*p);ctx.fillRect(x2-3,y,6,38+24*p);
 }
}
function hud(){
 let a=[["⭐ PUNKTE",score],["LEVEL",level],["🍴 GEFANGEN",caught+"/20"]];
 a.forEach((v,i)=>{let gap=7,m=10,b=(W-m*2-gap*2)/3,x=m+i*(b+gap);
  ctx.fillStyle="#10314d";rr(x,10,b,78,16);ctx.fill();ctx.strokeStyle="#7895a8";ctx.lineWidth=3;ctx.stroke();
  ctx.textAlign="center";ctx.fillStyle="#fff";ctx.font="900 13px system-ui";ctx.fillText(v[0],x+b/2,34);
  ctx.fillStyle="#ffd72f";ctx.font="1000 28px system-ui";ctx.fillText(v[1],x+b/2,64);
 })
}
function laneX(l,z){let q=roadPoint(H*.31+(H*.68)*z);return q.l+(q.r-q.l)*(l+.5)/3}
function spawn(){let f=foods[Math.floor(Math.random()*foods.length)];items.push({e:f[0],p:f[1],lane:Math.floor(Math.random()*3),z:0})}
function drawCar(){
 const y=H-116,s=1.05;
 ctx.save();ctx.translate(carX,y);ctx.scale(s,s);
 // shadow
 ctx.fillStyle="#0008";ctx.beginPath();ctx.ellipse(0,58,115,17,0,0,7);ctx.fill();
 // rear wheels
 ctx.fillStyle="#111";ctx.beginPath();ctx.ellipse(-78,24,23,40,0,0,7);ctx.ellipse(78,24,23,40,0,0,7);ctx.fill();
 // body
 let g=ctx.createLinearGradient(-100,-35,100,45);g.addColorStop(0,"#ff3d5b");g.addColorStop(.45,"#d71942");g.addColorStop(1,"#8c0e2d");
 ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(-96,-32,192,82,30);ctx.fill();
 // side pods
 ctx.fillStyle="#f1264b";ctx.beginPath();ctx.roundRect(-112,-2,38,45,14);ctx.roundRect(74,-2,38,45,14);ctx.fill();
 // cockpit rim
 ctx.fillStyle="#0b1e2c";ctx.beginPath();ctx.ellipse(0,-27,55,39,0,0,7);ctx.fill();
 // windshield
 ctx.fillStyle="#58cce8";ctx.globalAlpha=.7;ctx.beginPath();ctx.ellipse(0,-30,44,30,0,0,7);ctx.fill();ctx.globalAlpha=1;
 // driver face - clearly seated in cockpit
 ctx.save();ctx.beginPath();ctx.ellipse(0,-30,38,29,0,0,7);ctx.clip();ctx.drawImage(face,-34,-78,68,86);ctx.restore();
 // cockpit rim over lower face
 ctx.strokeStyle="#091c29";ctx.lineWidth=7;ctx.beginPath();ctx.ellipse(0,-28,47,34,0,0,7);ctx.stroke();
 // nose + spoiler
 ctx.fillStyle="#c91137";ctx.beginPath();ctx.moveTo(-48,34);ctx.lineTo(48,34);ctx.lineTo(30,63);ctx.lineTo(-30,63);ctx.closePath();ctx.fill();
 ctx.fillStyle="#ef3152";ctx.fillRect(-92,49,184,10);ctx.fillStyle="#101418";ctx.fillRect(-104,59,208,8);
 // headlights
 ctx.fillStyle="#fff4bf";ctx.beginPath();ctx.ellipse(-52,37,11,7,0,0,7);ctx.ellipse(52,37,11,7,0,0,7);ctx.fill();
 ctx.restore();
}
function draw(){
 ctx.clearRect(0,0,W,H);scenery();
 ctx.textAlign="center";ctx.textBaseline="middle";
 items.forEach(f=>{ctx.save();let z=f.z,sz=24+z*48;ctx.translate(laneX(f.lane,z),H*.31+(H*.68)*z);ctx.font=sz+"px serif";ctx.fillText(f.e,0,0);ctx.restore()});
 drawCar();hud();
}
function loop(t){
 if(!running)return;let dt=Math.min(.033,(t-last)/1000);last=t;
 carX+=(targetX-carX)*Math.min(1,dt*16);scroll+=dt*(150+level*32);spawnClock+=dt;
 if(spawnClock>Math.max(.43,.9-level*.055)){spawnClock=0;spawn()}
 for(let i=items.length-1;i>=0;i--){let f=items[i];f.z+=(.00060+level*.00007)*dt*1000;let fx=laneX(f.lane,f.z),fy=H*.31+(H*.68)*f.z;
  if(f.z>.83&&Math.abs(fx-carX)<66){score+=f.p;caught++;items.splice(i,1);let n=document.getElementById("nam");n.textContent="NAMNAM! +"+f.p;n.classList.remove("show");void n.offsetWidth;n.classList.add("show");
   if(caught>=20){caught=0;level++}}
  else if(f.z>1.08)items.splice(i,1)
 }
 document.getElementById("score").textContent=score;document.getElementById("level").textContent=level;document.getElementById("got").textContent=caught+"/20";
 draw();raf=requestAnimationFrame(loop)
}
document.getElementById("go").onclick=()=>{document.getElementById("menu").style.display="none";running=true;last=performance.now();requestAnimationFrame(loop)}
cv.addEventListener("pointerdown",e=>targetX=e.clientX);cv.addEventListener("pointermove",e=>{if(e.buttons)targetX=e.clientX});
addEventListener("keydown",e=>{if(e.key==="ArrowLeft")targetX-=80;if(e.key==="ArrowRight")targetX+=80;targetX=Math.max(W*.23,Math.min(W*.77,targetX))});
})();
</script></body></html>
